<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymWork - Menú Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f0f; /* Fondo oscuro liso */
            color: white;
        }

        /* 2. Barra de navegación superior */
        .navbar {
            background-color: #1a1a1a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #fcd535; /* Línea amarilla estilo Gold's Gym */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .navbar h1 {
            font-family: 'Bebas Neue', sans-serif;
            margin: 0;
            font-size: 32px;
            color: #fcd535;
            letter-spacing: 2px;
        }

        /* Botón de cerrar sesión */
        .btn-logout {
            background: transparent;
            color: white;
            border: 1px solid #fcd535;
            padding: 8px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #fcd535;
            color: black;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>GYMWORK</h1>
        <button class="btn-logout" onclick="cerrarSesion()">CERRAR SESIÓN</button>
    </nav>
    
    <script>
        // Función para cerrar sesión y volver a la pantalla de Login
        function cerrarSesion() {
            // Confirmación básica antes de salir
            if(confirm("¿Estás seguro de que deseas salir del sistema?")) {
                // Aquí en el futuro borrarás el localStorage o tokens de sesión
                
                // Redirige al login (Asegúrate de que el nombre del archivo coincida)
                window.location.href = 'Principal.html';
            }
        }
    </script>

</body>
</html>
