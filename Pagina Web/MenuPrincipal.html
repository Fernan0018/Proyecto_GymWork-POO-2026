<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymWork - Menú Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f0f; /* Fondo oscuro liso */
            color: white;
        }

        /* 2. Barra de navegación superior */
        .navbar {
            background-color: #1a1a1a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #fcd535; /* Línea amarilla estilo Gold's Gym */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .navbar h1 {
            font-family: 'Bebas Neue', sans-serif;
            margin: 0;
            font-size: 32px;
            color: #fcd535;
            letter-spacing: 2px;
        }

        /* 3. Contenedor del Perfil y Dropdown */
        .profile-container {
            position: relative;
            display: inline-block;
        }

        /* Botón del icono de perfil */
        .profile-btn {
            background: #000; /* Fondo negro para que coincida con tu imagen */
            border: 2px solid #555;
            border-radius: 50%; /* Lo hace completamente circular */
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            overflow: hidden; /* IMPORTANTE: Corta las esquinas de la imagen si es cuadrada */
        }

        /* Ajustes para la imagen del perfil */
        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scale(1.15); /* 👈 Hacemos zoom para ocultar el margen blanco de la imagen */
        }

        /* Efecto Hover en el borde del botón de perfil */
        .profile-btn:hover {
            border-color: #fcd535; /* El borde se vuelve amarillo al pasar el mouse */
        }

        /* Menú desplegable (oculto por defecto) */
        .dropdown-menu {
            display: none; 
            position: absolute;
            right: 0;
            top: 55px; /* Separación respecto a la barra */
            background-color: #1a1a1a;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.6);
            border: 1px solid #333;
            border-radius: 4px;
            z-index: 1000;
            overflow: hidden;
        }

        /* Elementos dentro del menú */
        .dropdown-item {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }

        /* Efecto hover para las opciones activas */
        .dropdown-item:hover:not(.disabled) {
            background-color: #fcd535;
            color: black;
        }

        /* Opción deshabilitada (Ver Perfil) */
        .dropdown-item.disabled {
            color: #555;
            cursor: not-allowed;
            background-color: #151515;
        }

        /* Clase auxiliar para mostrar el menú con JavaScript */
        .show {
            display: block;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>GYMWORK</h1>
        
        <div class="profile-container">
            <button class="profile-btn" id="btnPerfil">
                <img src="User_Profile.jpg" alt="Perfil"> 
            </button>
            
            <div class="dropdown-menu" id="menuDesplegable">
                <div class="dropdown-item disabled">VER PERFIL</div>
                <div class="dropdown-item" onclick="cerrarSesion()">CERRAR SESIÓN</div>
            </div>
        </div>
    </nav>
    
    <script>
        const btnPerfil = document.getElementById('btnPerfil');
        const menuDesplegable = document.getElementById('menuDesplegable');

        // 1. Mostrar/Ocultar el menú al hacer clic en el botón de perfil
        btnPerfil.addEventListener('click', function(evento) {
            evento.stopPropagation(); 
            menuDesplegable.classList.toggle('show');
        });

        // 2. Cerrar el menú automáticamente si el usuario hace clic en otra parte
        document.addEventListener('click', function() {
            if (menuDesplegable.classList.contains('show')) {
                menuDesplegable.classList.remove('show');
            }
        });

        // 3. Función para cerrar sesión y volver a la pantalla de Login silenciosamente
        function cerrarSesion() {
            // Redirige directamente al login sin mostrar ningún mensaje
            window.location.href = 'Login.html';
        }
    </script>

</body>
</html>
