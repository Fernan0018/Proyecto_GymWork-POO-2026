<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymWork - Menú Principal</title>
    <link rel="icon" type="image/png" href="GymWork_Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f0f; /* Fondo oscuro liso */
            color: white;
        }

        /* 2. Barra de navegación superior */
        .navbar {
            background-color: #1a1a1a;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #fcd535; /* Línea amarilla estilo Gold's Gym */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .navbar h1 {
            font-family: 'Bebas Neue', sans-serif;
            margin: 0;
            font-size: 32px;
            color: #fcd535;
            letter-spacing: 2px;
        }

        /* 3. Contenedor del Perfil y Dropdown */
        .profile-container {
            position: relative;
            display: inline-block;
        }

        /* Botón del icono de perfil */
        .profile-btn {
            background: #000; /* Fondo negro para que coincida con tu imagen */
            border: 2px solid #555;
            border-radius: 50%; /* Lo hace completamente circular */
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0;
            overflow: hidden; /* IMPORTANTE: Corta las esquinas de la imagen si es cuadrada */
        }

        /* Ajustes para la imagen del perfil */
        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scale(1.15); /* 👈 Hacemos zoom para ocultar el margen blanco de la imagen */
        }

        /* Efecto Hover en el borde del botón de perfil */
        .profile-btn:hover {
            border-color: #fcd535; /* El borde se vuelve amarillo al pasar el mouse */
        }

        /* Menú desplegable (oculto por defecto) */
        .dropdown-menu {
            display: none; 
            position: absolute;
            right: 0;
            top: 55px; /* Separación respecto a la barra */
            background-color: #1a1a1a;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.6);
            border: 1px solid #333;
            border-radius: 4px;
            z-index: 1000;
            overflow: hidden;
        }

        /* Elementos dentro del menú */
        .dropdown-item {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }

        /* Efecto hover para las opciones activas */
        .dropdown-item:hover:not(.disabled) {
            background-color: #fcd535;
            color: black;
        }

        /* Opción deshabilitada (Ver Perfil) */
        .dropdown-item.disabled {
            color: #555;
            cursor: not-allowed;
            background-color: #151515;
        }

        /* Clase auxiliar para mostrar el menú con JavaScript */
        .show {
            display: block;
        }
        /* 4. Estilos del Dashboard */
        .dashboard-layout {
            display: flex;
            height: calc(100vh - 80px);
        }

        .dashboard-main-content {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            overflow: hidden;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        .background-circle {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 2px solid rgba(255, 204, 0, 0.15);
            box-shadow: 0 0 100px rgba(255, 204, 0, 0.05) inset;
            z-index: 1;
        }

        .welcome-message-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .greeting {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            color: #f0f0f0;
        }

        .status-message {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .instruction {
            font-size: 1.2rem;
            font-weight: 300;
            color: #aaaaaa;
            line-height: 1.5;
        }

        /* 5. Barra lateral izquierda */
        .sidebar {
            width: 260px;
            background-color: #1a1a1a;
            border-right: 2px solid #fcd535;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        .sidebar-header {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: #fcd535;
            text-align: center;
            padding: 10px 15px 25px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 25px;
            color: #cccccc;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            border-left: 4px solid transparent;
            letter-spacing: 0.5px;
        }

        .sidebar-item:hover {
            background-color: rgba(252, 213, 53, 0.1);
            color: #ffffff;
            border-left-color: #fcd535;
        }

        .sidebar-item.active {
            background-color: rgba(252, 213, 53, 0.15);
            color: #fcd535;
            border-left-color: #fcd535;
        }

        .sidebar-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* 6. Tarjeta de perfil */
        .profile-card {
            display: none;
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px 50px;
            width: 500px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            position: relative;
            z-index: 2;
        }

        .profile-card.visible {
            display: block;
        }

        .profile-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            color: #fcd535;
            margin: 0 0 30px 0;
            text-align: center;
            letter-spacing: 2px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-field {
            display: flex;
            flex-direction: column;
        }

        .profile-field.full-width {
            grid-column: 1 / -1;
        }

        .profile-field label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .profile-field span {
            font-size: 16px;
            color: #fff;
            font-weight: 500;
        }

        .profile-close-btn {
            margin-top: 30px;
            grid-column: 1 / -1;
            padding: 12px;
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .profile-close-btn:hover {
            border-color: #fcd535;
            color: #fcd535;
        }

        .profile-edit-btn {
            margin-top: 10px;
            grid-column: 1 / -1;
            padding: 12px;
            background: #fcd535;
            border: none;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .profile-edit-btn:hover {
            background: #e6c12e;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>GYMWORK</h1>
        
        <div class="profile-container">
            <button class="profile-btn" id="btnPerfil">
                <img src="User_Profile.jpg" alt="Perfil"> 
            </button>
            
            <div class="dropdown-menu" id="menuDesplegable">
                <div class="dropdown-item" onclick="verPerfil()">VER PERFIL</div>
                <div class="dropdown-item" onclick="cerrarSesion()">CERRAR SESIÓN</div>
            </div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <nav class="sidebar">
            <div class="sidebar-header">MÓDULOS</div>
            <div class="sidebar-item" data-modulo="suscripciones">
                <img class="sidebar-icon" src="Suscripciones.png" alt="Suscripciones"> Suscripciones
            </div>
            <div class="sidebar-item" data-modulo="registro">
                <img class="sidebar-icon" src="Registro.png" alt="Registro"> Registro
            </div>
            <div class="sidebar-item" data-modulo="sedes">
                <img class="sidebar-icon" src="Sedes.png" alt="Sedes"> Sedes
            </div>
            <div class="sidebar-item" data-modulo="maquinas">
                <img class="sidebar-icon" src="Maquinas.png" alt="Estado de Máquinas"> Estado de Máquinas
            </div>
            <div class="sidebar-item" data-modulo="soporte">
                <img class="sidebar-icon" src="Soporte.png" alt="Soporte"> Soporte
            </div>
            <div class="sidebar-item" data-modulo="admin">
                <img class="sidebar-icon" src="Administracion.png" alt="Módulo de Administración"> Módulo de Administración
            </div>
        </nav>

        <div class="dashboard-main-content">
            <div class="background-circle"></div>
            <div class="welcome-message-container" id="welcomeContainer">
                <h1 class="greeting" id="greeting"></h1>
                <h2 class="status-message">El gimnasio está funcionando bien.</h2>
                <p class="instruction">Seleccione una opción en el menú lateral<br>para gestionar los módulos.</p>
            </div>
            <div class="profile-card" id="profileCard">
                <h2>PERFIL DEL ADMINISTRADOR</h2>
                <div class="profile-grid">
                    <div class="profile-field">
                        <label>Nombre</label>
                        <span id="pNombre">—</span>
                    </div>
                    <div class="profile-field">
                        <label>Apellidos</label>
                        <span id="pApellidos">—</span>
                    </div>
                    <div class="profile-field">
                        <label>Fecha de Nacimiento</label>
                        <span id="pFechaNac">—</span>
                    </div>
                    <div class="profile-field">
                        <label>Edad</label>
                        <span id="pEdad">—</span>
                    </div>
                    <div class="profile-field full-width">
                        <label>Correo Electrónico</label>
                        <span id="pCorreo">—</span>
                    </div>
                    <div class="profile-field full-width">
                        <label>Teléfono</label>
                        <span id="pTelefono">—</span>
                    </div>
                    <button class="profile-close-btn" onclick="cerrarPerfil()">CERRAR</button>
                    <button class="profile-edit-btn" onclick="editarPerfil()">EDITAR PERFIL</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 0. Saludar según la hora del día
        const hora = new Date().getHours();
        let saludo;
        if (hora >= 6 && hora < 12) {
            saludo = 'Buenos días';
        } else if (hora >= 12 && hora < 18) {
            saludo = 'Buenas tardes';
        } else {
            saludo = 'Buenas noches';
        }
        const nombreUsuario = sessionStorage.getItem('username') || 'Administrador';
        document.getElementById('greeting').innerText = `Hola, ${nombreUsuario}. ${saludo}`;

        const btnPerfil = document.getElementById('btnPerfil');
        const menuDesplegable = document.getElementById('menuDesplegable');

        // 1. Mostrar/Ocultar el menú al hacer clic en el botón de perfil
        btnPerfil.addEventListener('click', function(evento) {
            evento.stopPropagation(); 
            menuDesplegable.classList.toggle('show');
        });

        // 2. Cerrar el menú automáticamente si el usuario hace clic en otra parte
        document.addEventListener('click', function() {
            if (menuDesplegable.classList.contains('show')) {
                menuDesplegable.classList.remove('show');
            }
        });

        // 3. Función para cerrar sesión y volver a la pantalla de Login silenciosamente
        function cerrarSesion() {
            // Redirige directamente al login sin mostrar ningún mensaje
            window.location.href = 'Login.html';
        }

        // 4. Ver perfil del administrador
        async function verPerfil() {
            const username = sessionStorage.getItem('username');
            console.log('VER PERFIL - username:', username);
            if (!username) return;

            menuDesplegable.classList.remove('show');

            try {
                const respuesta = await fetch(`http://localhost:8080/api/perfil?username=${encodeURIComponent(username)}`);
                console.log('Respuesta status:', respuesta.status);
                if (!respuesta.ok) {
                    const errorText = await respuesta.text();
                    console.error('Error del servidor:', errorText);
                    return;
                }

                const datos = await respuesta.json();
                console.log('Datos recibidos:', datos);

                document.getElementById('pNombre').textContent = datos.nombre;
                document.getElementById('pApellidos').textContent = datos.apellidos;
                document.getElementById('pFechaNac').textContent = datos.fechaNacimiento;
                document.getElementById('pEdad').textContent = datos.edadActual + ' años';
                document.getElementById('pCorreo').textContent = datos.correo;
                document.getElementById('pTelefono').textContent = datos.telefono;

                document.getElementById('welcomeContainer').style.display = 'none';
                document.getElementById('profileCard').classList.add('visible');
            } catch (e) {
                console.error('Error de red:', e);
            }
        }

        function cerrarPerfil() {
            document.getElementById('profileCard').classList.remove('visible');
            document.getElementById('welcomeContainer').style.display = '';
        }

        function editarPerfil() {
            // Pendiente de implementar
        }

        // 5. Navegación por la barra lateral
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const modulo = this.getAttribute('data-modulo');
                // Mostrar mensaje indicando el módulo seleccionado
                const greeting = document.getElementById('greeting');
                const statusMsg = document.querySelector('.status-message');
                const instruction = document.querySelector('.instruction');
                greeting.innerText = `Módulo: ${this.textContent.trim()}`;
                statusMsg.innerText = 'Cargando contenido...';
                instruction.innerHTML = 'Use las opciones disponibles<br>para gestionar este módulo.';
            });
        });
    </script>

</body>
</html>
